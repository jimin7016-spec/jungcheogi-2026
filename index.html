<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쑥쑥 스터디</title>
<meta name="description" content="시험까지 공부한 만큼 캐릭터가 쑥쑥 자라는 학습 플래너 (정보처리기사·AWS 등 여러 시험, 여러 사용자)">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF8E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쑥쑥 스터디">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 폰 한 컬럼(최대 480px). 두 화면 모두 위에 벤토 그리드(D-day 큰 카드 + 연속 공부 + 오늘/총 공부),
   그 아래 병아리가 사는 하늘색 펫 카드, 이어서 할 일·달력 카드가 쌓인다. 하단 탭바 두 개.
   제목·큰 숫자는 Jua, 본문은 Pretendard. 크림 배경에 노랑·부리 오렌지·하늘·민트 파스텔. */
:root {
  --bg: #FFF8E1;
  --card: #FFFFFF;
  --card-line: #F5E3A1;
  --soft: #FFF3C9;
  --yellow: #FFD23F;
  --yellow-edge: #E0A800;
  --orange: #FF9F45;
  --orange-edge: #D9771C;
  --orange-text: #A8540C;
  --sky: #BFE6FF;
  --sky-2: #E6F5FF;
  --mint: #7ED9A6;
  --mint-edge: #45B07A;
  --mint-ink: #14532F;
  --ink: #4A3B32;
  --muted: #6E5B4D;
  --faint: #74624B;
  --danger: #A83328;
  --danger-soft: #FFE4E0;
  --t-bg: #DCEBFF; --t-fg: #2C5A96; --t-dot: #5B9CF0;
  --s-bg: #ECE5FF; --s-fg: #5840B0; --s-dot: #9A84F0;
  --m-bg: #FFE1EC; --m-fg: #A0335F; --m-dot: #EE82AC;
  --c-bg: #D8F4E4; --c-fg: #1F6B45; --c-dot: #45B07A;
  --r-bg: #FFE9CF; --r-fg: #9A5210; --r-dot: #FF9F45;
  --shadow: 0 2px 10px rgba(180, 140, 40, 0.07);
  --r-card: 24px;
  --r-btn: 16px;
  --tabh: 68px;
  --font-cute: "Jua", "Pretendard Variable", Pretendard, sans-serif;
  --font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.55 var(--font-body); letter-spacing: -0.01em; }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.num, .jua { font-family: var(--font-cute); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0; }

.app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; }
@media (min-width: 560px) { .app { box-shadow: 0 0 0 1px var(--card-line); } }
#screen { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(var(--tabh) + 32px + env(safe-area-inset-bottom, 0px)); outline: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* ---------- tab bar ---------- */
.tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 480px); z-index: 20; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: #FFFFFF; border-top: 1.5px solid var(--card-line); border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(180, 140, 40, .08); }
.tab { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: var(--r-btn); text-decoration: none; color: var(--muted); font: 400 16px var(--font-cute); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 2px var(--yellow); }

/* ---------- common ---------- */
.card { background: var(--card); border: 1.5px solid var(--card-line); border-radius: var(--r-card); padding: 18px 16px; box-shadow: var(--shadow); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.sec-h h2 { font: 400 20px/1.3 var(--font-cute); }
.sec-h span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.lv-chip { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--card-line); font: 400 14px var(--font-cute); }
.lv-chip b { font-weight: 400; color: var(--orange-text); }

.tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.55; background: var(--tb); color: var(--tf); }
[data-t="t"] { --tb: var(--t-bg); --tf: var(--t-fg); --tc: var(--t-dot); }
[data-t="s"] { --tb: var(--s-bg); --tf: var(--s-fg); --tc: var(--s-dot); }
[data-t="m"] { --tb: var(--m-bg); --tf: var(--m-fg); --tc: var(--m-dot); }
[data-t="c"] { --tb: var(--c-bg); --tf: var(--c-fg); --tc: var(--c-dot); }
[data-t="r"] { --tb: var(--r-bg); --tf: var(--r-fg); --tc: var(--r-dot); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: var(--r-btn); border: 2px solid var(--card-line); border-bottom-width: 4px; background: var(--card); color: var(--ink); font: 400 16px var(--font-cute); transition: transform .08s, border-bottom-width .08s; }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.primary { background: var(--yellow); border-color: var(--yellow-edge); }
.btn.mint { background: var(--mint); border-color: var(--mint-edge); }
.btn.danger { background: var(--danger-soft); border-color: #EFB0A8; color: var(--danger); }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 14.5px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13.5px; color: var(--muted); }
.link { min-height: 44px; background: none; border: 0; padding: 0 4px; font: 400 15px var(--font-cute); color: var(--orange-text); }

/* ---------- bento ---------- */
.bento { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px; }
.bento .card { padding: 14px 14px 13px; }
.b-dday { grid-row: span 2; background: var(--yellow); border-color: var(--yellow-edge); border-bottom-width: 4px; display: flex; flex-direction: column; justify-content: space-between; min-height: 164px; position: relative; overflow: hidden; }
.b-dday small { font-size: 13px; font-weight: 700; color: #6B4E00; }
.b-dday .big { white-space: nowrap; font: 400 clamp(38px, 13vw, 56px)/1 var(--font-cute); font-variant-numeric: tabular-nums; letter-spacing: -1px; margin: 6px 0 4px; }
.b-dday .big.long { font-size: clamp(30px, 10vw, 44px); }
.b-dday .date { font-size: 12.5px; font-weight: 600; color: #6B4E00; position: relative; z-index: 1; }
.b-dday .deco { position: absolute; right: -14px; bottom: -18px; width: 86px; height: 86px; opacity: .9; }
.b-mini { display: grid; gap: 2px; align-content: center; }
.b-mini small { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.b-mini small svg { width: 18px; height: 18px; }
.b-mini .val { font: 400 27px/1.1 var(--font-cute); font-variant-numeric: tabular-nums; }
.b-mini .val span { font-size: 16px; margin-left: 2px; }
.b-mini .sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.b-streak.on { background: #FFF1E3; border-color: #FFC999; }
.b-wide { grid-column: span 2; }
.body2 { display: contents; }
.bento4 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.bento4 .card { padding: 13px 14px; }

/* ---------- pet card ---------- */
.pet { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 78%); border-color: #A6D6F5; padding: 14px 16px 16px; display: grid; justify-items: center; gap: 4px; }
.pet .cloud { position: absolute; fill: #fff; opacity: .9; }
.pet .hill { position: absolute; left: -12%; right: -12%; bottom: -70px; height: 140px; background: #FFEFB8; border-radius: 50% 50% 0 0; box-shadow: inset 0 6px 0 #FFE08A; }
.pet > * { position: relative; }
.pet .hill, .pet .cloud { position: absolute; }
.bubble { max-width: 300px; background: #fff; border-radius: 18px; padding: 9px 15px; font: 400 16px/1.4 var(--font-cute); text-align: center; box-shadow: 0 2px 0 rgba(74, 59, 50, .06); min-height: 42px; z-index: 2; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bubble.pop { animation: pop .35s ease-out; }
.pet .char { width: 150px; height: 150px; margin-top: 6px; z-index: 1; }
.pet-meta { width: 100%; display: grid; gap: 6px; z-index: 2; margin-top: -4px; }
.pet-name { display: flex; justify-content: space-between; align-items: baseline; font: 400 16px var(--font-cute); }
.pet-name small { font: 600 12px var(--font-body); color: var(--muted); }
.exp-track { height: 16px; border-radius: 999px; background: #fff; border: 2px solid #fff; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--card-line); }
.exp-track i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #FFE066, var(--yellow) 60%, var(--orange)); transition: width .6s cubic-bezier(.3, 1.4, .5, 1); }
.exp-txt { font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: center; }
.pet.big .char { width: 170px; height: 170px; }
.pet .line { font-size: 13px; color: var(--muted); font-weight: 600; z-index: 2; margin-top: -2px; }

/* ---------- character ---------- */
.char { border: 0; background: none; padding: 0; display: block; position: relative; }
.char svg { display: block; width: 100%; height: 100%; overflow: visible; }
.char .body { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.8s ease-in-out infinite; }
.char .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
.char.hop .body { animation: hop .6s ease-out; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-3px) scale(1.02, .98); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(2px) scale(1.1, .88); } 55% { transform: translateY(-20px) scale(.95, 1.06); } 80% { transform: translateY(0) scale(1.05, .95); } 100% { transform: none; } }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

.confetti { position: absolute; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 3px; background: var(--c); animation: burst 1.2s cubic-bezier(.2, .7, .4, 1) forwards; }
.confetti i.s { width: 10px; height: 10px; border-radius: 50%; }
@keyframes burst { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
.glow { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .9), transparent 60%); animation: glow 1s ease-out forwards; z-index: 4; }
@keyframes glow { from { opacity: 1; } to { opacity: 0; } }

/* ---------- 오늘 ---------- */
.datenav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 6px; }
.nav-btn { width: 48px; height: 48px; border-radius: var(--r-btn); border: 2px solid var(--card-line); border-bottom-width: 4px; background: var(--card); display: grid; place-items: center; }
.nav-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn:disabled { opacity: .35; }
.dn-mid { text-align: center; display: grid; gap: 1px; }
.dn-mid h1 { font: 400 23px/1.25 var(--font-cute); }
.dn-mid small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.today-badge { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 999px; background: var(--orange); color: var(--ink); font: 400 13px/1.7 var(--font-cute); vertical-align: 3px; }
.back-today { justify-self: center; margin-top: -10px; }

.sum { display: grid; gap: 10px; }
.sum-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.sum-row .big { font: 400 30px/1 var(--font-cute); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.sum-row .big em { font: 400 13px/1 var(--font-cute); font-style: normal; background: var(--mint); color: var(--mint-ink); padding: 5px 9px; border-radius: 999px; }
.sum-row .tm { text-align: right; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.sum-row .tm b { display: block; color: var(--ink); font: 400 18px var(--font-cute); font-variant-numeric: tabular-nums; }
.pbar { position: relative; height: 14px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #FFE066, var(--yellow) 60%, var(--orange)); transition: width .5s cubic-bezier(.3, 1.4, .5, 1); }

.day-body { display: grid; gap: 12px; }
.list-h { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px -4px; }
.list-h h2 { font: 400 19px var(--font-cute); }

.tcard { background: var(--card); border: 1.5px solid var(--card-line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 14px 14px 12px; display: grid; gap: 8px; transition: background .2s, border-color .2s; }
.tcard.on { background: #F1FBF5; border-color: #A9E6C4; }
.tcard.pop { animation: pop .4s ease-out; }
.t-top { display: flex; align-items: flex-start; gap: 12px; }
.t-info { flex: 1; min-width: 0; min-height: 44px; display: grid; gap: 5px; background: none; border: 0; padding: 0; text-align: left; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.t-ttl { font-weight: 700; font-size: 16px; line-height: 1.4; }
.tcard.on .t-ttl { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(74, 59, 50, .35); text-decoration-thickness: 2px; }
.chk { flex: none; width: 48px; height: 48px; border-radius: var(--r-btn); border: 2px solid #EAD9A6; border-bottom-width: 4px; background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 26px; height: 26px; opacity: 0; transform: scale(.3); transition: opacity .15s, transform .25s cubic-bezier(.3, 1.6, .5, 1); color: var(--mint-ink); }
.chk:active { transform: translateY(2px); border-bottom-width: 2px; }
.tcard.on .chk { background: var(--mint); border-color: var(--mint-edge); }
.tcard.on .chk svg { opacity: 1; transform: scale(1); }
.t-det { font-size: 13.5px; color: var(--muted); line-height: 1.55; background: none; border: 0; padding: 0; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
.t-det.open { display: block; }
.t-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; border-top: 1.5px dashed var(--card-line); font-size: 13px; color: var(--muted); font-weight: 600; }
.t-foot .lab { font: 400 15px var(--font-cute); color: var(--ink); white-space: nowrap; }
.t-foot .pl { margin-left: auto; white-space: nowrap; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border-radius: 14px; border: 2px solid var(--card-line); border-bottom-width: 3px; background: var(--soft); font: 400 20px/1 var(--font-cute); }
.step button:active { transform: translateY(1px); border-bottom-width: 2px; }
.step input { width: 58px; height: 44px; border: 2px solid var(--card-line); border-radius: 14px; text-align: center; background: #fff; font: 400 18px var(--font-cute); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.step input::placeholder { color: #BFAE95; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.rest-card { text-align: center; display: grid; gap: 4px; padding: 22px 16px; }
.rest-card h2 { font: 400 20px var(--font-cute); }
.rest-card p { color: var(--muted); font-size: 14px; }

.extra-row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 20px; border: 2px dashed #F2D58A; background: #FFFCF0; text-align: left; }
.extra-row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: none; }
.extra-row .x-ttl { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.extra-row .x-min { font: 400 16px var(--font-cute); color: var(--orange-text); font-variant-numeric: tabular-nums; }
.add-btn { min-height: 58px; font-size: 18px; }

.memo label { display: block; font: 400 17px var(--font-cute); margin-bottom: 8px; }
.memo textarea { width: 100%; min-height: 76px; resize: vertical; border: 2px solid var(--card-line); border-radius: 16px; padding: 11px 13px; background: #FFFDF5; font-size: 14.5px; font-weight: 500; }

/* ---------- 계획·성장 ---------- */
.dex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dex-tile { background: var(--soft); border: 1.5px solid var(--card-line); border-radius: 20px; padding: 8px 6px; display: grid; justify-items: center; gap: 1px; text-align: center; position: relative; }
.dex-tile svg { width: 74px; height: 74px; }
.dex-tile b { font: 400 14px/1.25 var(--font-cute); word-break: keep-all; }
.dex-tile small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.dex-tile.locked { background: #F7F0DE; }
.dex-tile.locked svg { filter: grayscale(1) brightness(.2) opacity(.14); }
.dex-tile.locked b { color: var(--faint); }
.dex-tile.cur { background: #FFF6CF; border: 2.5px solid var(--yellow); }
.dex-tile .now { position: absolute; top: -8px; right: -4px; background: var(--orange); color: var(--ink); font: 400 12px/1 var(--font-cute); padding: 5px 8px; border-radius: 999px; transform: rotate(6deg); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.lg-full { background: var(--yellow); }
.lg-part { background: #FFF0B3; box-shadow: inset 0 0 0 1.5px #F2CF55; }
.lg-none { background: #EFE6D2; }
.lg-future { background: #fff; box-shadow: inset 0 0 0 1.5px var(--card-line); }
.cal-card { padding-left: 12px; padding-right: 12px; }
.cal-wd, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-wd { margin-bottom: 6px; }
.cal-wd span { text-align: center; font: 400 13px var(--font-cute); color: var(--muted); }
.cal-wd span:nth-child(6) { color: var(--t-fg); }
.cal-wd span:nth-child(7) { color: var(--danger); }
.cell { aspect-ratio: 1 / 1.15; min-height: 44px; border-radius: 14px; border: 0; padding: 4px 1px; display: grid; grid-template-rows: auto auto; align-content: center; gap: 3px; justify-items: center; align-items: center; background: #fff; box-shadow: inset 0 0 0 1.5px var(--card-line); position: relative; min-width: 0; }
.cell .n { font: 400 14px/1.2 var(--font-cute); }
.cell .n.hol { color: var(--danger); }
.cell .v { font-size: 10.5px; font-weight: 700; color: var(--muted); line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell.out { background: transparent; box-shadow: none; color: var(--faint); }
.cell.out .n { opacity: .6; }
.cell.full { background: var(--yellow); box-shadow: inset 0 -3px 0 var(--yellow-edge); }
.cell.full .v, .cell.part .v { color: var(--ink); }

.cell.none { background: #EFE6D2; box-shadow: none; }
.cell.none .v { color: #65543F; }
.cell.exam { background: #FFE1DC; box-shadow: inset 0 0 0 2px #F2A99F; }
.cell.exam .v { color: var(--danger); }
.cell.today { box-shadow: 0 0 0 3px var(--orange); }
.cell .edited { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--s-dot); }
.cal-cap { font-size: 12.5px; color: var(--muted); margin-top: 12px; font-weight: 500; }

.phase { margin-top: 16px; }
.phase:first-of-type { margin-top: 0; }
.phase-t { display: flex; align-items: center; gap: 8px; }
.phase-t .num { width: 26px; height: 26px; border-radius: 9px; background: var(--yellow); display: grid; place-items: center; font: 400 14px var(--font-cute); flex: none; }
.phase-t b { font: 400 17px var(--font-cute); flex: 1; min-width: 0; }
.phase-t .r { font-size: 12px; color: var(--muted); font-weight: 600; }
.phase-d { font-size: 13px; color: var(--muted); margin: 4px 0 6px 34px; }
.lrow { width: 100%; min-height: 52px; display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border: 0; border-bottom: 1.5px dashed var(--card-line); background: none; text-align: left; }
.lrow:last-child { border-bottom: 0; }
.lrow .d { font: 400 16px/1.1 var(--font-cute); }
.lrow .d small { display: block; font: 600 11px var(--font-body); color: var(--muted); margin-top: 2px; }
.lrow .m { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .m small { color: var(--muted); }
.lrow .m .ed { display: inline-block; font-size: 11px; font-weight: 700; color: var(--s-fg); background: var(--s-bg); border-radius: 999px; padding: 0 7px; margin-right: 4px; vertical-align: 1px; }
.lrow .s { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lrow .sdot { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--card-line); }
.lrow.full .sdot { background: var(--mint); box-shadow: none; }
.lrow.part .sdot { background: #FFF0B3; box-shadow: inset 0 0 0 2px #F2CF55; }
.lrow.today { background: #FFF6D6; border-radius: 14px; }

.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.part { background: var(--soft); border-radius: 18px; padding: 11px 12px; display: grid; gap: 3px; }
.part .pk { font: 400 12.5px var(--font-cute); color: var(--orange-text); }
.part .pn { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.part .mini { height: 8px; border-radius: 999px; background: #fff; overflow: hidden; margin-top: 4px; }
.part .mini i { display: block; height: 100%; width: 0; background: var(--mint); border-radius: 999px; }
.part .pc { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.msg { font-size: 14px; margin-top: 10px; min-height: 1em; }

/* ---------- bottom sheet ---------- */
#sheet-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#sheet-root.open { pointer-events: auto; }
.sh-back { position: absolute; inset: 0; background: rgba(74, 59, 50, .38); opacity: 0; transition: opacity .2s; }
#sheet-root.open .sh-back { opacity: 1; }
.sh-panel { position: absolute; left: 50%; bottom: 0; width: min(100%, 480px); max-height: 88dvh; transform: translate(-50%, 100%); transition: transform .28s cubic-bezier(.3, 1.2, .5, 1); background: var(--bg); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sh-panel::before { content: ""; width: 44px; height: 5px; border-radius: 3px; background: var(--card-line); margin: 10px auto 0; flex: none; }
#sheet-root.open .sh-panel { transform: translate(-50%, 0); }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px; }
.sh-head h2 { flex: 1; font: 400 21px/1.3 var(--font-cute); }
.sh-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; }
.sh-x svg { width: 18px; height: 18px; }
.sh-body { overflow-y: auto; padding: 4px 16px 22px; display: grid; gap: 14px; overscroll-behavior: contain; }

.field { display: grid; gap: 7px; }
.field > span { font: 400 16px var(--font-cute); }
.field input[type="text"], .field input[type="number"], .field textarea { width: 100%; min-height: 48px; border: 2px solid var(--card-line); border-radius: var(--r-btn); padding: 11px 13px; background: #fff; font-size: 15.5px; font-weight: 500; }
.field textarea { min-height: 68px; resize: vertical; font-size: 14.5px; }
.field input:focus, .field textarea:focus, .memo textarea:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255, 210, 63, .35); }
.pick { display: flex; flex-wrap: wrap; gap: 7px; }
.pick button { min-height: 44px; padding: 0 15px; border-radius: 999px; border: 2px solid var(--card-line); border-bottom-width: 3px; background: #fff; font: 400 15px var(--font-cute); }
.pick button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow-edge); }
.pick.tags button[aria-pressed="true"] { background: var(--tb); border-color: var(--tc); color: var(--tf); }
.min-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.min-row input { width: 96px !important; text-align: center; font: 400 18px var(--font-cute) !important; }

.ed-item { background: var(--card); border: 1.5px solid var(--card-line); border-radius: 20px; padding: 12px 12px 10px; display: grid; gap: 6px; }
.ed-item .t-ttl { font-size: 15px; }
.ed-item .acts { display: flex; gap: 6px; justify-content: flex-end; }
.ed-flag { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--s-bg); color: var(--s-fg); border-radius: 16px; padding: 8px 8px 8px 14px; font-size: 13.5px; font-weight: 700; }
.sh-sum { font-size: 13.5px; color: var(--muted); font-weight: 600; }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -150%); opacity: 0; visibility: hidden; z-index: 60; background: var(--ink); color: #FFF8E1; padding: 12px 20px; border-radius: 20px; font: 400 17px var(--font-cute); box-shadow: 0 10px 30px rgba(74, 59, 50, .25); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; width: max-content; max-width: calc(100% - 32px); text-align: center; }
#toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ---------- 사용자 · 시험 · 설정 화면 ---------- */
.brand { border: 0; background: none; padding: 4px 6px 4px 0; min-height: 48px; text-align: left; cursor: pointer; border-radius: var(--r-btn); }
.brand > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--soft); border: 1.5px solid var(--card-line); display: grid; place-items: center; overflow: hidden; flex: none; }
.avatar svg { width: 88%; height: 88%; }
.avatar.lg { width: 72px; height: 72px; }
.avatar.xl { width: 112px; height: 112px; background: linear-gradient(180deg, var(--sky), var(--sky-2)); border-color: #A6D6F5; }
.who { display: grid; line-height: 1.2; min-width: 0; }
.who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { font: 400 19px/1.2 var(--font-cute); }
.who small { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { text-align: center; }

.screen-h { display: flex; align-items: center; gap: 12px; padding: 8px 2px 2px; }
.sh-txt { min-width: 0; }
.sh-txt h1 { font: 400 25px/1.25 var(--font-cute); }
.sh-txt p { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }

.user-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ucard { display: grid; justify-items: center; gap: 6px; padding: 18px 10px 16px; border-radius: var(--r-card); border: 2px solid var(--card-line); border-bottom-width: 5px; background: var(--card); text-align: center; min-height: 170px; align-content: center; }
.ucard:active { transform: translateY(3px); border-bottom-width: 2px; }
.ucard b { font: 400 21px var(--font-cute); }
.ucard small { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.ucard.add { border-style: dashed; background: #FFFCF0; }
.ucard .plus { width: 72px; height: 72px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; }
.ucard .plus svg { width: 30px; height: 30px; }

.pin-wrap { display: grid; justify-items: center; gap: 14px; padding-top: 6px; }
.pin-wrap.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pin-dots { display: flex; gap: 16px; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--yellow-edge); background: #fff; transition: background .12s, transform .12s; }
.pin-dots i.on { background: var(--yellow); transform: scale(1.1); }
.pin-msg { min-height: 22px; font-size: 14px; font-weight: 700; color: var(--danger); }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
.key { width: 76px; height: 64px; border-radius: 20px; border: 2px solid var(--card-line); border-bottom-width: 5px; background: var(--card); font: 400 28px var(--font-cute); display: grid; place-items: center; }
.key:active { transform: translateY(3px); border-bottom-width: 2px; background: var(--soft); }
.key svg { width: 26px; height: 26px; }

.exam-list { display: grid; gap: 12px; }
.exam-card { background: var(--card); border: 1.5px solid var(--card-line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 6px 8px 4px; display: grid; }
.exam-main { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border: 0; background: none; text-align: left; min-height: 72px; }
.exam-main .avatar { width: 56px; height: 56px; }
.exam-info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.exam-info b { font: 400 19px/1.25 var(--font-cute); }
.exam-info small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.dd-pill { flex: none; padding: 6px 11px; border-radius: 999px; background: var(--yellow); font: 400 17px var(--font-cute); font-variant-numeric: tabular-nums; }
.small-del { justify-self: end; font-size: 13px; color: var(--danger); }

.steps { display: flex; justify-content: center; gap: 8px; }
.steps i { width: 10px; height: 10px; border-radius: 999px; background: var(--card-line); transition: width .2s; }
.steps i.done { background: var(--yellow-edge); }
.steps i.on { width: 28px; background: var(--yellow); }
.wiz { display: grid; gap: 14px; }
.err { color: var(--danger); font-weight: 700; min-height: 1.2em; margin: -4px 4px; }
.field input[type="date"], .pin-input { width: 100%; min-height: 48px; border: 2px solid var(--card-line); border-radius: var(--r-btn); padding: 10px 13px; background: #fff; font-size: 16px; font-weight: 600; }
.pin-input { font: 400 24px var(--font-cute); letter-spacing: 12px; text-align: center; }
.char-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.char-opt { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 20px; border: 2px solid var(--card-line); border-bottom-width: 4px; background: #fff; text-align: center; }
.char-opt b { font: 400 15px var(--font-cute); }
.char-opt small { font-size: 11px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.char-opt[aria-checked="true"], .opt-card[aria-checked="true"] { background: #FFF6CF; border-color: var(--yellow-edge); box-shadow: 0 0 0 3px rgba(255, 210, 63, .35); }
.opt-list { display: grid; gap: 8px; }
.opt-card { display: grid; gap: 3px; padding: 13px 15px; border-radius: 18px; border: 2px solid var(--card-line); border-bottom-width: 4px; background: #fff; text-align: left; min-height: 56px; }
.opt-card b { font: 400 17px var(--font-cute); }
.opt-card small { font-size: 12.5px; color: var(--muted); font-weight: 600; line-height: 1.4; }
.ai-box { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--soft); }
.ai-box textarea { width: 100%; min-height: 120px; border: 2px solid var(--card-line); border-radius: 14px; padding: 10px 12px; background: #fff; font-size: 13px; font-weight: 500; resize: vertical; }
.ai-box textarea.prompt { min-height: 150px; background: #FFFDF5; color: var(--muted); }

@media (max-width: 360px) {
  .b-dday .deco { width: 58px; height: 58px; right: -12px; bottom: -14px; opacity: .55; }
  .b-dday { min-height: 150px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .char .body, .char .eyes { animation: none !important; }
  .confetti, .glow { display: none; }
}
