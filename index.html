<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정처기 합격 체크표</title>
<meta name="description" content="정보처리기사 실기 10월 25일 시험까지 날짜별로 체크하는 학습 플래너">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E2233" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16324A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정처기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* Layout: 폰 화면 기준 한 컬럼(최대 520px). 위는 남색 히어로(날짜 또는 D-day), 아래로 카드가 쌓이고, 하단 탭 두 개(오늘 / 누적)로 화면을 바꾼다. 색은 교재 표지의 하늘색과 남색. */
:root {
  --bg: #EAF1F6;
  --surface: #FFFFFF;
  --surface-2: #F3F7FA;
  --ink: #0E2233;
  --muted: #55697A;
  --line: #D6E1E9;
  --accent: #1592D6;
  --accent-text: #0A6BA3;
  --accent-soft: #D3ECF9;
  --hero-bg: #0E2233;
  --hero-ink: #F1F7FB;
  --hero-muted: #A5BCCB;
  --hero-line: #26435C;
  --hero-accent: #5CC4F2;
  --mark: #FFE94A;
  --mark-ink: #0E2233;
  --c-t: #2E7DD7;
  --c-s: #0E9F86;
  --c-m: #C47400;
  --c-c: #7B4FD6;
  --c-r: #E5484D;
  --shadow: 0 1px 2px rgba(14, 34, 51, 0.06), 0 8px 24px rgba(14, 34, 51, 0.06);
  --tabh: 58px;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A131A; --surface: #131F29; --surface-2: #182733; --ink: #E6EEF4; --muted: #93A6B5; --line: #243543;
    --accent: #5CC4F2; --accent-text: #7FD0F5; --accent-soft: #16384B;
    --hero-bg: #16324A; --hero-line: #2E5069;
    --mark: #F2DC3A;
    --c-t: #3F86DC; --c-s: #22A48B; --c-m: #C58118; --c-c: #8D6AE6; --c-r: #E85B62;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.03);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }

.app { max-width: 520px; margin: 0 auto; min-height: 100dvh; background: var(--bg); }
@media (min-width: 600px) { .app { box-shadow: 0 0 0 1px var(--line); } }
#screen { padding-bottom: calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); outline: none; }

.tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 520px); z-index: 10; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tabh); text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent-text); }
.tab:focus-visible { outline: 3px solid var(--accent-text); outline-offset: -3px; }

/* hero */
.hero { background: var(--hero-bg); color: var(--hero-ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 16px; border-radius: 0 0 24px 24px; display: grid; gap: 14px; }
.hero small { color: var(--hero-muted); }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero-left { min-width: 0; display: grid; gap: 2px; justify-items: start; }
.hero-left small { font: 500 12px var(--font-mono); }
.hero h1 { font: 700 26px/1.2 var(--font-body); }
.hero .sub { font: 400 12px/1.5 var(--font-mono); color: var(--hero-muted); }
.dd { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; flex: none; }
.dd small { font: 500 12px var(--font-mono); }
.dd b { font: 400 44px/1 var(--font-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent-text); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.hero .link-btn { color: var(--hero-accent); }
.link-btn:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

.strip { display: flex; gap: 4px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.pill { flex: none; width: 46px; padding: 7px 0 8px; border-radius: 14px; border: 0; background: transparent; color: var(--hero-muted); display: grid; justify-items: center; gap: 1px; cursor: pointer; }
.pill .n { font: 700 17px/1.3 var(--font-body); color: var(--hero-ink); padding: 0 5px; border-radius: 6px; }
.pill .w { font-size: 11px; }
.pill .st { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--hero-muted); margin-top: 4px; }
.pill.full .st { background: var(--hero-accent); border-color: var(--hero-accent); }
.pill.part .st { background: linear-gradient(90deg, var(--hero-accent) 50%, transparent 50%); border-color: var(--hero-accent); }
.pill.rest .st { border-style: dotted; }
.pill.today .n { background: var(--mark); color: var(--mark-ink); }
.pill[aria-pressed="true"] { background: var(--hero-line); box-shadow: inset 0 0 0 1.5px var(--hero-accent); }
.pill:focus-visible { outline: 3px solid var(--hero-accent); outline-offset: 1px; }

.body { padding: 16px; display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 12px; }
.sec-h h2 { font: 700 17px/1.4 var(--font-body); }
.sec-h span { font-size: 13px; color: var(--muted); }

/* day summary */
.sum-top { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sum-top small { display: block; font-size: 12px; color: var(--muted); }
.sum-top b { font: 700 22px/1.3 var(--font-body); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin-top: 12px; border: 1px solid var(--line); }
.track .plan, .track .act { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width 0.25s; }
.track .plan { background: var(--accent-soft); }
.track .act { background: var(--accent); }

/* task card */
.tcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.tmain { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 16px; cursor: pointer; outline: none; }
.tmain:focus-visible { box-shadow: inset 0 0 0 3px var(--accent-text); }
.bub { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--ink); position: relative; margin-top: 2px; transition: background 0.15s; }
.tcard.on .bub { background: var(--ink); }
.tcard.on .bub::after { content: ""; position: absolute; left: 9px; top: 3px; width: 8px; height: 15px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.ttxt { display: block; min-width: 0; }
.ttxt > * { display: block; }
.meta { display: flex !important; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.slot { font: 500 12px var(--font-mono); color: var(--ink); }
.tag { display: inline-flex; align-items: center; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
[data-t="t"] > .dot, .mix-bar [data-t="t"] { background: var(--c-t); }
[data-t="s"] > .dot, .mix-bar [data-t="s"] { background: var(--c-s); }
[data-t="m"] > .dot, .mix-bar [data-t="m"] { background: var(--c-m); }
[data-t="c"] > .dot, .mix-bar [data-t="c"] { background: var(--c-c); }
[data-t="r"] > .dot, .mix-bar [data-t="r"] { background: var(--c-r); }
.chip-part { display: inline-block; background: var(--accent); color: #0E2233; font: 700 11px/1 var(--font-body); letter-spacing: 0.04em; padding: 4px 7px; border-radius: 4px; }
.pg { font: 400 11.5px var(--font-mono); background: var(--surface-2); padding: 2px 7px; border-radius: 4px; color: var(--muted); }
.ttl { font-weight: 700; font-size: 16px; line-height: 1.4; margin-top: 6px; text-wrap: pretty; overflow-wrap: anywhere; }
.tcard.on .ttl { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tdet { padding: 0 16px 14px 62px; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.tfoot { display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
.tfoot label { font-weight: 700; font-size: 13px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 700 20px/1 var(--font-body); color: var(--ink); cursor: pointer; }
.step button:active { background: var(--accent-soft); }
.step input { width: 64px; height: 42px; text-align: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: 500 17px var(--font-mono); font-variant-numeric: tabular-nums; }
.step button:focus-visible, .step input:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 1px; }
.tfoot .pl { margin-left: auto; font: 400 12px var(--font-mono); color: var(--muted); text-align: right; }

.memo label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.memo textarea { width: 100%; min-height: 88px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.memo textarea:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 1px; }
.memo textarea::placeholder { color: var(--muted); }
.rest-card p { color: var(--muted); }
.rest-card h2 { font: 700 17px/1.4 var(--font-body); margin-bottom: 4px; }

/* total: hero */
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hero-main .dd { align-items: flex-start; }
.hero-main .dd b { font-size: 68px; margin-top: 8px; }
.eyebrow { font: 500 12px var(--font-mono); letter-spacing: 0.04em; color: var(--hero-muted); }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { display: block; width: 96px; height: 96px; }
.ring-bg { fill: none; stroke: var(--hero-line); stroke-width: 10; }
.ring-fg { fill: none; stroke: var(--hero-accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.4s; }
.ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-txt b { font: 400 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring-txt small { font-size: 11px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; padding-top: 14px; border-top: 1px solid var(--hero-line); }
.stat dt { font-size: 12px; color: var(--hero-muted); }
.stat dd { margin: 2px 0 0; font: 700 19px/1.25 var(--font-body); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat small { display: block; font: 400 11px/1.4 var(--font-mono); margin-top: 2px; font-variant-numeric: tabular-nums; }

.goal p { color: var(--muted); font-size: 14px; }
.gauge { position: relative; height: 84px; margin: 8px 8px 0; }
.gauge-track { position: absolute; left: 0; right: 0; top: 36px; height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.gauge-gap { position: absolute; left: 45%; width: 15%; top: 0; bottom: 0; background: var(--mark); }
.gauge-pin { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; line-height: 1.2; }
.gauge-pin b { font: 400 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.gauge-pin small { font-size: 12px; color: var(--muted); }
.gauge-pin.below { top: 52px; }
.gauge-pin.above::after, .gauge-pin.below::before { content: ""; width: 2px; height: 10px; background: var(--ink); }
.gauge-scale { position: absolute; left: 0; right: 0; bottom: -2px; display: flex; justify-content: space-between; font: 400 11px var(--font-mono); color: var(--muted); }

.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.part { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 6px; min-width: 0; justify-items: start; }
.part-name { font-weight: 700; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.part-pg { font: 400 11px var(--font-mono); color: var(--muted); }
.mini { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; width: 100%; }
.mini i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.part-n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.sw.plan { background: var(--accent-soft); border: 1px solid var(--accent); }
.sw.act { background: var(--accent); }
.sw.today { background: var(--mark); }
.plot { position: relative; height: 132px; margin-left: 26px; }
.gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.gl span { position: absolute; left: -26px; top: -8px; width: 22px; text-align: right; font: 400 10px var(--font-mono); color: var(--muted); }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; }
.col { position: relative; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 3px; }
.col.today { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.col.sel { box-shadow: inset 0 0 0 1.5px var(--ink); }
.col:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; }
.bp, .ba { position: absolute; bottom: 0; border-radius: 3px 3px 0 0; }
.bp { left: 0; right: 0; background: var(--accent-soft); border: 1px solid var(--accent); border-bottom: 0; }
.ba { left: 22%; right: 22%; background: var(--accent); }
.xl { margin: 6px 0 0 26px; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; height: 14px; }
.xl span { position: relative; font: 400 10px/14px var(--font-mono); color: var(--muted); white-space: nowrap; }
.xl span b { font-weight: 400; position: absolute; left: 0; }
.xl span.end b { left: auto; right: 0; }
.cap-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; min-height: 28px; }
.cap { font: 400 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.mix-bar { display: flex; height: 12px; gap: 2px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
.mix-bar span { display: block; height: 100%; }
.mix-leg { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.phase-t { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 2px; }
.phase-t:first-of-type { margin-top: 0; }
.phase-t .num { font: 400 26px/1 var(--font-display); color: var(--accent-text); }
.phase-t b { font-size: 14px; }
.phase-t span.r { font: 400 11.5px var(--font-mono); color: var(--muted); margin-left: auto; }
.lrow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 11px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.lrow:focus-visible { outline: 3px solid var(--accent-text); outline-offset: -2px; }
.lrow .d { font: 700 15px/1.2 var(--font-body); font-variant-numeric: tabular-nums; }
.lrow .d small { display: block; font: 400 11px var(--font-mono); color: var(--muted); }
.lrow .m { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .m small { color: var(--muted); font-size: 12px; }
.lrow .s { display: flex; align-items: center; gap: 8px; font: 400 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sdot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.lrow.full .sdot { background: var(--accent); border-color: var(--accent); }
.lrow.part .sdot { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.lrow.rest .sdot { border-style: dotted; }
.lrow.today .d { background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.lrow.today .d small { color: var(--mark-ink); }

.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 700 14px var(--font-body); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--c-r); border-color: currentColor; background: transparent; }
.btn:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.msg { margin-top: 10px; font-size: 13.5px; }

@media (max-width: 380px) {
  .hero-main .dd b { font-size: 56px; }
  .ring, .ring svg { width: 84px; height: 84px; }
  .stat dd { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .track .plan, .track .act, .ring-fg, .mini i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <main id="screen" tabindex="-1"></main>
  <nav class="tabs" aria-label="화면 전환">
    <a class="tab" id="tab-today" href="#today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg>
      오늘 계획
    </a>
    <a class="tab" id="tab-total" href="#total">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-6"></path></svg>
      누적
    </a>
  </nav>
</div>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
