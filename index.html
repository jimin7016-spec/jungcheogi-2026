<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정처기 삐약 플래너</title>
<meta name="description" content="정보처리기사 실기 10월 25일 시험까지 공부한 만큼 병아리가 자라는 학습 플래너">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#BFE6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정처기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: 폰 한 컬럼(최대 480px). 1화면은 하늘·모래 배경 위에 병아리 캐릭터, 아래로 흰 시트가 올라와 그날 계획과 기록을 보여준다.
   2화면은 노란 히어로(D-day·캐릭터 성장), 도감, 달력, 전체 계획 순. 하단 탭 두 개. 크림·노랑 파스텔 톤. */
:root {
  --bg: #FFF8EC;
  --surface: #FFFFFF;
  --surface-2: #FFF4DC;
  --ink: #3B2F2A;
  --muted: #8C7B6B;
  --line: #F1E4C9;
  --yellow: #FFCB3D;
  --yellow-deep: #F2A516;
  --yellow-soft: #FFF0BF;
  --orange: #FF8B3D;
  --pink: #FFB3B3;
  --sky-1: #A9DDFB;
  --sky-2: #E3F4FF;
  --sand: #F4DDAE;
  --sand-2: #EACB8D;
  --danger: #E0564B;
  --ok: #3FB28A;
  --c-t: #5B9CF0;
  --c-s: #9A84F0;
  --c-m: #EE82AC;
  --c-c: #35B99A;
  --c-r: #F2A516;
  --shadow: 0 2px 0 rgba(170, 130, 60, 0.08), 0 10px 24px rgba(170, 130, 60, 0.10);
  --tabh: 64px;
  --font-cute: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--yellow-deep); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; }
@media (min-width: 560px) { .app { box-shadow: 0 0 0 1px var(--line); } }
#screen { padding-bottom: calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); outline: none; }

/* ---------- tabs ---------- */
.tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 480px); z-index: 20; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; box-shadow: 0 -6px 20px rgba(170, 130, 60, .08); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tabh); text-decoration: none; color: #B8A690; font: 400 13px var(--font-cute); }
.tab .ti { width: 40px; height: 28px; border-radius: 14px; display: grid; place-items: center; transition: background .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ti { background: var(--yellow); }

/* ---------- common ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .85); font: 400 13px/1.3 var(--font-cute); color: var(--ink); box-shadow: 0 2px 0 rgba(0, 0, 0, .05); }
.card { background: var(--surface); border-radius: 24px; padding: 18px 16px; box-shadow: var(--shadow); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sec-h h2 { font: 400 19px/1.3 var(--font-cute); }
.sec-h span { font-size: 12px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--tc, var(--c-r)); line-height: 1.5; }
[data-t="t"] { --tc: var(--c-t); }
[data-t="s"] { --tc: var(--c-s); }
[data-t="m"] { --tc: var(--c-m); }
[data-t="c"] { --tc: var(--c-c); }
[data-t="r"] { --tc: var(--c-r); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 16px; border: 0; background: var(--surface-2); color: var(--ink); font: 400 15px var(--font-cute); box-shadow: 0 3px 0 rgba(170, 130, 60, .18); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(170, 130, 60, .18); }
.btn.primary { background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-deep); }
.btn.danger { background: #FFE3E0; color: #B63A31; box-shadow: 0 3px 0 #F4B9B2; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13px; color: var(--muted); }
.link { background: none; border: 0; padding: 4px 2px; font: 400 14px var(--font-cute); color: var(--yellow-deep); }

/* ---------- character ---------- */
.char { border: 0; background: none; padding: 0; display: block; }
.char svg { display: block; width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
.char.hop svg { animation: hop .6s ease-out; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.02, .98); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(2px) scale(1.08, .9); } 55% { transform: translateY(-22px) scale(.95, 1.06); } 80% { transform: translateY(0) scale(1.05, .95); } 100% { transform: translateY(0) scale(1, 1); } }
@media (prefers-reduced-motion: reduce) { .char svg, .char.hop svg { animation: none; } }

.exp { display: grid; gap: 4px; }
.exp-track { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .8); border: 2px solid #fff; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08); }
.exp-track i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #FFD95A, #FFB020); transition: width .5s ease; }
.exp small { font: 400 12.5px var(--font-cute); color: var(--ink); opacity: .8; text-align: center; }

/* ---------- 오늘 : scene ---------- */
.scene { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 70%); padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 44px; }
.scene .cloud { position: absolute; fill: #fff; opacity: .9; }
.scene-top { position: relative; display: flex; justify-content: space-between; gap: 8px; z-index: 2; }
.dd-chip { background: var(--ink); color: #fff; }
.stage { position: relative; z-index: 2; display: grid; justify-items: center; padding-top: 8px; }
.bubble { position: relative; max-width: 290px; background: #fff; border-radius: 18px; padding: 9px 14px; font: 400 15px/1.4 var(--font-cute); text-align: center; box-shadow: 0 3px 0 rgba(0, 0, 0, .06); margin-bottom: 10px; min-height: 40px; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bubble.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.stage .char { width: 138px; height: 138px; }
.scene .exp { position: relative; z-index: 2; width: min(260px, 80%); margin: 4px auto 0; }
.ground { position: absolute; left: -10%; right: -10%; bottom: -60px; height: 150px; background: var(--sand); border-radius: 50% 50% 0 0; z-index: 1; box-shadow: inset 0 8px 0 var(--sand-2); }

/* ---------- 오늘 : sheet ---------- */
.sheet { position: relative; margin-top: -26px; z-index: 3; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px 0; display: grid; gap: 14px; }
.sheet::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.datenav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 4px; }
.nav-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn:disabled { opacity: .3; }
.dn-mid { text-align: center; display: grid; gap: 1px; }
.dn-mid h1 { font: 400 23px/1.25 var(--font-cute); }
.dn-mid small { font-size: 12.5px; color: var(--muted); }
.dn-mid .today-badge { display: inline-block; margin-right: 4px; padding: 0 7px; border-radius: 999px; background: var(--orange); color: #fff; font: 400 12px/1.6 var(--font-cute); vertical-align: 3px; }
.back-today { justify-self: center; margin-top: -8px; }
.day-body { display: grid; gap: 12px; }

.sum { display: grid; gap: 10px; }
.sum-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.sum-row .big { font: 400 26px/1 var(--font-cute); }
.sum-row .big em { font-style: normal; color: var(--ok); font-size: 18px; margin-left: 4px; }
.sum-row .tm { text-align: right; font-size: 13px; color: var(--muted); }
.sum-row .tm b { color: var(--ink); font: 400 17px var(--font-cute); }
.pbar { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #FFD95A, #FFB020); transition: width .4s ease; }

.list-h { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px -4px; }
.list-h h2 { font: 400 17px var(--font-cute); }

.tcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 14px 12px; display: grid; gap: 8px; border: 2px solid transparent; transition: border-color .2s, background .2s; }
.tcard.on { background: #FFFBEA; border-color: #FFE08A; }
.t-top { display: flex; align-items: flex-start; gap: 10px; }
.t-info { flex: 1; min-width: 0; display: grid; gap: 4px; background: none; border: 0; padding: 0; text-align: left; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.t-ttl { font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.tcard.on .t-ttl { text-decoration: line-through; text-decoration-color: rgba(59, 47, 42, .35); text-decoration-thickness: 2px; color: var(--muted); }
.chk { flex: none; width: 38px; height: 38px; border-radius: 14px; border: 2.5px solid #E6D6B6; background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s, transform .15s; }
.chk svg { width: 22px; height: 22px; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s; }
.tcard.on .chk { background: var(--yellow); border-color: var(--yellow-deep); }
.tcard.on .chk svg { opacity: 1; transform: scale(1); }
.chk:active { transform: scale(.9); }
.t-det { font-size: 13px; color: var(--muted); line-height: 1.5; background: none; border: 0; padding: 0; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-det.open { display: block; }
.t-foot { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1.5px dashed var(--line); font-size: 13px; color: var(--muted); }
.t-foot .lab { font: 400 14px var(--font-cute); color: var(--ink); }
.t-foot .pl { margin-left: auto; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--surface-2); font-size: 18px; line-height: 1; }
.step input { width: 54px; height: 32px; border: 2px solid var(--line); border-radius: 10px; text-align: center; background: #fff; font-weight: 700; -moz-appearance: textfield; }
.step input::placeholder { color: #CDBFA8; font-weight: 400; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.rest-card { text-align: center; display: grid; gap: 4px; padding: 22px 16px; }
.rest-card h2 { font: 400 20px var(--font-cute); }
.rest-card p { color: var(--muted); font-size: 14px; }

.extra-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; border: 2px dashed #F0D9A6; background: #FFFCF3; text-align: left; }
.extra-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: none; }
.extra-row .x-ttl { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.extra-row .x-min { font: 400 15px var(--font-cute); color: var(--yellow-deep); }
.add-btn { min-height: 54px; font-size: 17px; border-radius: 20px; }
.add-btn svg { width: 20px; height: 20px; }

.memo label { display: block; font: 400 16px var(--font-cute); margin-bottom: 8px; }
.memo textarea { width: 100%; min-height: 70px; resize: vertical; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #FFFDF8; font-size: 14px; }

/* ---------- 계획·성장 ---------- */
.hero2 { background: linear-gradient(180deg, #FFE27A 0%, #FFF3C4 100%); padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 22px; border-radius: 0 0 32px 32px; display: grid; gap: 14px; }
.h2-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.h2-top .eyebrow { font: 400 14px var(--font-cute); color: #7A5A1E; }
.h2-top .dday { font: 400 50px/1 var(--font-cute); margin-top: 4px; letter-spacing: -1px; }
.h2-top .exam-date { font-size: 12.5px; color: #7A5A1E; margin-top: 4px; }
.grow { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; background: rgba(255, 255, 255, .6); border-radius: 24px; padding: 12px 14px; }
.grow .char { width: 120px; height: 120px; }
.grow .lv { font: 400 13px var(--font-cute); color: var(--yellow-deep); }
.grow h2 { font: 400 22px/1.2 var(--font-cute); }
.grow p { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.grow .exp small { text-align: left; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.stat { background: #fff; border-radius: 18px; padding: 10px 10px 9px; text-align: center; display: grid; gap: 1px; }
.stat dt { font-size: 11.5px; color: var(--muted); }
.stat dd { margin: 0; font: 400 21px/1.2 var(--font-cute); }
.stat small { font-size: 11px; color: var(--muted); }
.body2 { padding: 16px 16px 0; display: grid; gap: 14px; }

.dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dex-tile { background: var(--surface-2); border-radius: 18px; padding: 8px 6px 8px; display: grid; justify-items: center; gap: 2px; text-align: center; position: relative; }
.dex-tile svg { width: 72px; height: 72px; }
.dex-tile b { font: 400 13.5px var(--font-cute); }
.dex-tile small { font-size: 11px; color: var(--muted); }
.dex-tile.locked { background: #F6EEDD; }
.dex-tile.locked svg { filter: brightness(0) opacity(.16); }
.dex-tile.locked b { color: #B7A68C; }
.dex-tile.cur { background: var(--yellow-soft); box-shadow: inset 0 0 0 2.5px var(--yellow); }
.dex-tile .now { position: absolute; top: -6px; right: -2px; background: var(--orange); color: #fff; font: 400 11px/1 var(--font-cute); padding: 4px 7px; border-radius: 999px; transform: rotate(6deg); }

.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.lg-full { background: var(--yellow); }
.lg-part { background: var(--yellow-soft); box-shadow: inset 0 0 0 1.5px #FFD86B; }
.lg-none { background: #EFE7DA; }
.lg-future { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
.cal-wd, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-wd { margin-bottom: 5px; }
.cal-wd span { text-align: center; font: 400 12px var(--font-cute); color: var(--muted); }
.cal-wd span:nth-child(6) { color: var(--c-t); }
.cal-wd span:nth-child(7) { color: var(--danger); }
.cell { aspect-ratio: 1 / 1.12; border-radius: 12px; border: 0; padding: 4px 2px; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: center; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); position: relative; min-width: 0; }
.cell .n { font: 400 13.5px/1.2 var(--font-cute); }
.cell .n.hol { color: var(--danger); }
.cell .v { font-size: 10.5px; font-weight: 700; color: var(--muted); line-height: 1.1; white-space: nowrap; }
.cell.out { background: transparent; box-shadow: none; opacity: .35; }
.cell.full { background: var(--yellow); box-shadow: none; }
.cell.full .v, .cell.part .v { color: var(--ink); }
.cell.part { background: var(--yellow-soft); box-shadow: inset 0 0 0 1.5px #FFD86B; }
.cell.none { background: #EFE7DA; box-shadow: none; }
.cell.none .v { color: #A99A86; }
.cell.rest .v { color: #B7A68C; }
.cell.exam { background: #FFE3E0; box-shadow: inset 0 0 0 2px #F4B9B2; }
.cell.exam .v { color: #B63A31; }
.cell.today { box-shadow: 0 0 0 3px var(--orange); }
.cell .edited { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-s); }
.cal-cap { font-size: 12px; color: var(--muted); margin-top: 10px; }

.phase { margin-top: 14px; }
.phase:first-of-type { margin-top: 0; }
.phase-t { display: flex; align-items: center; gap: 8px; }
.phase-t .num { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font: 400 13px var(--font-cute); flex: none; }
.phase-t b { font: 400 16px var(--font-cute); font-weight: 400; flex: 1; min-width: 0; }
.phase-t .r { font-size: 12px; color: var(--muted); }
.phase-d { font-size: 12.5px; color: var(--muted); margin: 4px 0 6px 32px; }
.lrow { width: 100%; display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 10px 6px; border: 0; border-bottom: 1.5px dashed var(--line); background: none; text-align: left; }
.lrow:last-child { border-bottom: 0; }
.lrow .d { font: 400 15px/1.1 var(--font-cute); }
.lrow .d small { display: block; font: 400 11px var(--font-body); color: var(--muted); margin-top: 2px; }
.lrow .m { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .m small { color: var(--muted); }
.lrow .m .ed { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--c-s); border-radius: 999px; padding: 0 6px; margin-right: 4px; vertical-align: 1px; }
.lrow .s { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.lrow .sdot { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--line); }
.lrow.full .sdot { background: var(--yellow); box-shadow: none; }
.lrow.part .sdot { background: var(--yellow-soft); box-shadow: inset 0 0 0 2px #FFD86B; }
.lrow.today { background: #FFF6DB; border-radius: 12px; }

.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.part { background: var(--surface-2); border-radius: 16px; padding: 10px 12px; display: grid; gap: 3px; }
.part .pk { font: 400 12px var(--font-cute); color: var(--yellow-deep); }
.part .pn { font-size: 13px; font-weight: 700; line-height: 1.3; }
.part .mini { height: 7px; border-radius: 999px; background: #fff; overflow: hidden; margin-top: 3px; }
.part .mini i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 999px; }
.part .pc { font-size: 11.5px; color: var(--muted); }
.msg { font-size: 13.5px; margin-top: 10px; min-height: 1em; }

/* ---------- bottom sheet ---------- */
#sheet-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#sheet-root.open { pointer-events: auto; }
.sh-back { position: absolute; inset: 0; background: rgba(59, 47, 42, .35); opacity: 0; transition: opacity .2s; }
#sheet-root.open .sh-back { opacity: 1; }
.sh-panel { position: absolute; left: 50%; bottom: 0; width: min(100%, 480px); max-height: 88dvh; transform: translate(-50%, 100%); transition: transform .25s ease-out; background: var(--bg); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
#sheet-root.open .sh-panel { transform: translate(-50%, 0); }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 18px 16px 10px; }
.sh-head h2 { flex: 1; font: 400 20px/1.3 var(--font-cute); }
.sh-x { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.sh-x svg { width: 18px; height: 18px; }
.sh-body { overflow-y: auto; padding: 4px 16px 20px; display: grid; gap: 12px; overscroll-behavior: contain; }

.field { display: grid; gap: 6px; }
.field > span { font: 400 14.5px var(--font-cute); }
.field input[type="text"], .field input[type="number"], .field textarea { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 11px 12px; background: #fff; font-size: 15px; }
.field textarea { min-height: 64px; resize: vertical; font-size: 14px; }
.field input:focus, .field textarea:focus, .memo textarea:focus { outline: none; border-color: var(--yellow); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { min-height: 36px; padding: 0 13px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font: 400 14px var(--font-cute); }
.pick button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow-deep); }
.pick.tags button[aria-pressed="true"] { background: var(--tc); border-color: var(--tc); color: #fff; }
.min-row { display: flex; align-items: center; gap: 8px; }
.min-row input { width: 90px !important; text-align: center; font-weight: 700; }

.ed-item { background: var(--surface); border-radius: 18px; padding: 12px 12px 10px; box-shadow: var(--shadow); display: grid; gap: 6px; }
.ed-item .t-ttl { font-size: 14.5px; }
.ed-item .acts { display: flex; gap: 6px; justify-content: flex-end; }
.ed-flag { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #F1ECFF; color: #5B45B8; border-radius: 14px; padding: 8px 12px; font-size: 13px; }
.sh-sum { font-size: 13.5px; color: var(--muted); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%); z-index: 60; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 18px; font: 400 16px var(--font-cute); box-shadow: 0 10px 30px rgba(0, 0, 0, .2); transition: transform .3s ease, opacity .3s; opacity: 0; visibility: hidden; width: max-content; max-width: calc(100% - 32px); text-align: center; }
#toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
</style>
</head>

<div class="app">
  <main id="screen" tabindex="-1"></main>
  <nav class="tabs" aria-label="화면 전환">

    </a>
